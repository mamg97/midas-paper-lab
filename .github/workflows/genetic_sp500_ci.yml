name: Validate original genetic migration
on:
  pull_request:
    paths: ['AGENTE/genetic_invest_agent/**', '.github/workflows/genetic_sp500*.yml']
  push:
    branches: [main]
    paths: ['AGENTE/genetic_invest_agent/**', '.github/workflows/genetic_sp500*.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: AGENTE/genetic_invest_agent/requirements.txt
      - run: python -m pip install -r AGENTE/genetic_invest_agent/requirements.txt
      - run: python -m unittest discover -s AGENTE/genetic_invest_agent -p 'test_*.py' -v
      - run: python AGENTE/genetic_invest_agent/audit_publication.py
      - run: python AGENTE/genetic_invest_agent/publish_snapshot.py --check-only

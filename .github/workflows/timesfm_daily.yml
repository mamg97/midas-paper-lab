name: MIDAS TimesFM EUR daily paper

on:
  schedule:
    - cron: '37 0 * * 2-6'
    - cron: '7 2 * * 2-6'
  workflow_dispatch:
  pull_request:
    paths:
      - 'timesfm_strategy/**'
      - '.github/workflows/timesfm_daily.yml'
      - 'strategy_comparison/**'

permissions:
  contents: write

concurrency:
  group: midas-timesfm-eur
  cancel-in-progress: false

jobs:
  paper-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: timesfm_strategy/requirements-daily.txt
      - name: Install small daily runtime
        run: python -m pip install -r timesfm_strategy/requirements-daily.txt
      - name: Test EUR accounting and dashboard
        run: |
          python -m unittest discover -s timesfm_strategy/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
          python timesfm_strategy/run.py --phase check
      - name: Record latest closed daily XNYS session
        id: execute
        if: github.event_name != 'pull_request'
        run: python timesfm_strategy/run.py --phase daily
      - name: Persist scheduled execution health
        if: always() && github.event_name == 'schedule'
        run: |
          python strategy_comparison/runtime_health.py \
            --output strategy_runtime/timesfm_daily.json \
            --workflow-key timesfm_daily \
            --workflow-name "MIDAS TimesFM EUR daily paper" \
            --outcome "\${{ steps.execute.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --head-sha "$GITHUB_SHA"
      - name: Publish only TimesFM state
        if: always() && github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS TimesFM EUR daily paper state" \
            --path timesfm_state \
            --path strategy_runtime/timesfm_daily.json

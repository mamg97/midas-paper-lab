name: MIDAS TFG corrected paper

on:
  schedule:
    # Friday after XNYS close, plus a Saturday backup slot.
    - cron: '47 23 * * 5'
    - cron: '47 2 * * 6'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Verify TFG code/tests without recording a weekly signal'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: midas-tfg-corrected
  cancel-in-progress: false

jobs:
  tfg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tfg_ahp/requirements-live.txt
      - name: Install TFG runtime
        run: python -m pip install -r tfg_ahp/requirements-live.txt
      - name: Verify corrected TFG filters and accounting
        run: |
          python -m py_compile tfg_ahp/*.py strategy_comparison/report.py
          python -m unittest discover -s tfg_ahp/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
      - name: Record TFG weekly signal and paper ledger
        id: execute
        if: ${{ !inputs.preflight_only }}
        run: python tfg_ahp/run.py --output tfg_state
      - name: Record scheduled runtime health
        if: ${{ always() && github.event_name == 'schedule' && !inputs.preflight_only }}
        run: |
          python strategy_comparison/runtime_health.py \
            --output strategy_runtime/tfg_ahp.json \
            --workflow-key tfg_ahp \
            --workflow-name "MIDAS TFG corrected paper" \
            --outcome "${{ steps.execute.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --head-sha "$GITHUB_SHA"
      - name: Refresh all-strategy dashboard
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          python strategy_comparison/report.py \
            --registry strategy_comparison/registry.json \
            --paper-config paper_demo/config.json \
            --paper-state paper_state/state.json \
            --tfm-config tfm_shadow/config.json \
            --tfm-state tfm_state/ledger.json \
            --weekly-ml-config weekly_ml/config.json \
            --weekly-ml-state weekly_ml_state/ledger.json \
            --tfg-config tfg_ahp/config.json \
            --tfg-state tfg_state/ledger.json \
            --output strategy_state
      - name: Commit tfg ahp and dashboard state
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS TFG corrected paper state" \
            --path strategy_runtime/tfg_ahp.json \
            --path tfg_state

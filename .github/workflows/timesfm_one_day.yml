name: MIDAS TimesFM 2.5 EUR daily 1-session signal
on:
  schedule:
    - cron: '57 23 * * 1-5'
    - cron: '27 2 * * 2-6'
  workflow_dispatch:
  pull_request:
    paths:
      - 'timesfm_strategy/**'
      - '.github/workflows/timesfm_one_day.yml'
      - 'strategy_comparison/**'
permissions:
  contents: write
concurrency:
  group: midas-timesfm-eur
  cancel-in-progress: false
jobs:
  timesfm-one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: timesfm_strategy/requirements-weekly.txt
      - name: Validate accounting without loading model
        run: |
          python -m pip install -r timesfm_strategy/requirements-daily.txt
          python -m unittest discover -s timesfm_strategy/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
          python timesfm_strategy/daily_run.py --phase check
      - name: Cache pretrained weights
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: timesfm-2p5-200m-pytorch-2d1b320
      - name: Install model for scheduled inference
        if: github.event_name != 'pull_request'
        run: python -m pip install -r timesfm_strategy/requirements-weekly.txt
      - name: Close paper session then freeze one-day forecast
        id: execute
        if: github.event_name != 'pull_request'
        run: python timesfm_strategy/daily_run.py --phase daily
      - name: Record scheduled runtime health
        if: always() && github.event_name == 'schedule'
        run: |
          python strategy_comparison/runtime_health.py \
            --output strategy_runtime/timesfm_one_day.json \
            --workflow-key timesfm_one_day \
            --workflow-name "MIDAS TimesFM 2.5 EUR daily 1-session signal" \
            --outcome "${{ steps.execute.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --head-sha "$GITHUB_SHA"
      - name: Publish owned paper ledger and diagnostic
        if: always() && github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS TimesFM daily EUR paper" \
            --path timesfm_daily_state \
            --path strategy_runtime/timesfm_one_day.json

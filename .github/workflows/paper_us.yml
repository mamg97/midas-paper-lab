name: MIDAS paper comparison

on:
  schedule:
    # NYSE ha cerrado tanto en horario de verano como de invierno.
    - cron: '37 23 * * 1-5'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Verificar dependencias y pruebas sin registrar una sesión'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: midas-paper-comparison
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: paper_demo/requirements-live.lock.txt
      - name: Install market-data dependencies
        run: python -m pip install -r paper_demo/requirements-live.lock.txt
      - name: Verify accounting tests
        run: |
          python -m unittest discover -s paper_demo/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
      - name: Record today's paper portfolios
        if: ${{ !inputs.preflight_only }}
        run: python paper_demo/run.py --output paper_state
      - name: Build all-strategy status
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          python strategy_comparison/report.py \
            --registry strategy_comparison/registry.json \
            --paper-config paper_demo/config.json \
            --paper-state paper_state/state.json \
            --tfm-config tfm_shadow/config.json \
            --tfm-state tfm_state/ledger.json \
            --weekly-ml-config weekly_ml/config.json \
            --weekly-ml-state weekly_ml_state/ledger.json \
            --output strategy_state
      - name: Commit only MIDAS paper and comparison state
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          if [ -f strategy_state/dashboard.json ] && [ -f strategy_state/dashboard.md ]; then
            git add -- strategy_state/dashboard.json strategy_state/dashboard.md
          fi
          if [ -d paper_state ]; then
            git add -- paper_state/state.json paper_state/leaderboard.json paper_state/leaderboard.csv
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record MIDAS strategy comparison'
            git push
          fi

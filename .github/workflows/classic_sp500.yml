name: MIDAS classic S&P500 503 paper
on:
  workflow_call:
    inputs:
      common_capture:
        type: boolean
        default: false
  # Run once on a merged engine change, independently of nightly schedules.
  # State-only publisher commits do not match this path and cannot loop.
  push:
    branches: [main]
    paths:
      - 'classic_sp500/run.py'
  schedule:
    - cron: '47 23 * * 1-5'
    - cron: '17 2 * * 2-6'
  workflow_dispatch:
  pull_request:
    paths:
      - 'classic_sp500/**'
      - 'timesfm_strategy/run.py'
      - 'strategy_comparison/**'
      - '.github/workflows/classic_sp500.yml'
permissions:
  contents: write
concurrency:
  group: midas-classic-sp500
  cancel-in-progress: false
jobs:
  classic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.common_capture && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: timesfm_strategy/requirements-daily.txt
      - name: Install small Yahoo daily dependencies
        run: python -m pip install -r timesfm_strategy/requirements-daily.txt
      - name: Verify all classic variants, universe and report contracts
        run: |
          python -m unittest discover -s classic_sp500/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
          python classic_sp500/run.py --phase check
      - name: Require the published common XNYS source before accounting
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.common_capture
        run: python market_data/health.py --eligible
      - name: Record next-open paper ledger
        id: execute
        # A push can happen after the NEXT exchange open. It must never
        # retrospectively replay a previous session merely to validate code.
        # Prospective paper settlement is restricted to schedule/explicit dispatch.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.common_capture
        run: python classic_sp500/run.py --phase daily
      - name: Record schedule health
        if: always() && github.event_name == 'schedule' && !inputs.common_capture
        run: |
          python strategy_comparison/runtime_health.py \
            --output strategy_runtime/classic_sp500.json \
            --workflow-key classic_sp500 \
            --workflow-name "MIDAS classic S&P500 503 paper" \
            --outcome "${{ steps.execute.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --head-sha "$GITHUB_SHA"
      - name: Publish only owned state
        if: always() && github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS S&P500 classic forward paper" \
            --path classic_sp500_state \
            --path strategy_runtime/classic_sp500.json

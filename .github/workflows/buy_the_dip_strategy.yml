name: MIDAS Buy The Dip paper

on:
  push:
    branches: ['main']
    paths:
      - 'buy_the_dip_strategy/**'
      - 'strategy_comparison/**'
      - 'research/BUY_THE_DIP_SOURCE_STRATEGY.md'
      - '.github/workflows/buy_the_dip_strategy.yml'
  pull_request:
    paths:
      - 'buy_the_dip_strategy/**'
      - 'strategy_comparison/**'
      - 'research/BUY_THE_DIP_SOURCE_STRATEGY.md'
      - '.github/workflows/buy_the_dip_strategy.yml'
  schedule:
    # Daily valuation after XNYS close. Fundamentals/ranking are monthly.
    - cron: '27 23 * * 1-5'
  workflow_dispatch:
    inputs:
      record_session:
        description: 'Record the latest eligible closed session'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: midas-buy-the-dip
  cancel-in-progress: false

jobs:
  buy-the-dip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: buy_the_dip_strategy/requirements-live.txt
      - name: Install Buy The Dip runtime
        run: python -m pip install -r buy_the_dip_strategy/requirements-live.txt
      - name: Verify strategy, accounting and comparison integration
        run: |
          python -m py_compile buy_the_dip_strategy/*.py strategy_comparison/report.py
          python -m unittest discover -s buy_the_dip_strategy/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
      - name: Record Buy The Dip paper state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.record_session) }}
        run: python buy_the_dip_strategy/run.py --output buy_the_dip_state
      - name: Refresh all-strategy dashboard
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.record_session)) }}
        run: |
          python strategy_comparison/report.py             --registry strategy_comparison/registry.json             --paper-config paper_demo/config.json             --paper-state paper_state/state.json             --tfm-config tfm_shadow/config.json             --tfm-state tfm_state/ledger.json             --weekly-ml-config weekly_ml/config.json             --weekly-ml-state weekly_ml_state/ledger.json             --tfg-config tfg_ahp/config.json             --tfg-state tfg_state/ledger.json             --capital-cycle-config capital_cycle/config.json             --capital-cycle-state capital_cycle_state/ledger.json             --buy-the-dip-config buy_the_dip_strategy/config.json             --buy-the-dip-state buy_the_dip_state/ledger.json             --output strategy_state
      - name: Commit Buy The Dip and dashboard state
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.record_session)) }}
        run: |
          if [ -d buy_the_dip_state ]; then
            git add -- buy_the_dip_state
          fi
          if [ -f strategy_state/dashboard.json ] && [ -f strategy_state/dashboard.md ]; then
            git add -- strategy_state/dashboard.json strategy_state/dashboard.md
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record MIDAS Buy The Dip paper state'
            git push
          fi

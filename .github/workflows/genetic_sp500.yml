name: MIDAS original SP500 genetic agent

on:
  schedule:
    # UTC date has advanced beyond the completed New York session (including Friday).
    - cron: '7 0 * * 2-6'
    - cron: '7 3 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify, train without writing, republish existing summaries, or record a due paper session'
        type: choice
        options: [verify, training_check, publish_only, trade]
        default: verify

permissions:
  contents: read

concurrency:
  group: midas-original-genetic-writer
  cancel-in-progress: false

jobs:
  genetic:
    if: >-
      github.repository == 'mamg97/midas-paper-lab' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.GENETIC_PUBLIC_ACTIVE == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    env:
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: AGENTE/genetic_invest_agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r AGENTE/genetic_invest_agent/requirements.txt
      - name: Verify causal accounting, continuity and publication privacy
        run: |
          python -m unittest discover -s AGENTE/genetic_invest_agent -p 'test_*.py' -v
          python AGENTE/genetic_invest_agent/audit_publication.py
          python AGENTE/genetic_invest_agent/publish_snapshot.py --check-only
      - name: Full-size read-only training validation
        if: inputs.mode == 'training_check'
        run: python AGENTE/genetic_invest_agent/training_check.py
      - name: Check session before training
        id: session
        if: github.event_name == 'schedule' || inputs.mode == 'trade'
        run: python AGENTE/genetic_invest_agent/session_gate.py
      - name: Run original genetic campaign
        if: steps.session.outputs.due == 'true'
        working-directory: AGENTE/genetic_invest_agent
        run: python sp500_portfolio_agent.py
      - name: Preserve frozen cohorts and audit generated output
        if: steps.session.outputs.due == 'true'
        run: |
          git diff --exit-code -- AGENTE/genetic_invest_agent/registro_historico/diario_portfolio.json AGENTE/genetic_invest_agent/registro_historico/diario_portfolio_forward.json
          python AGENTE/genetic_invest_agent/audit_publication.py
          python AGENTE/genetic_invest_agent/publish_snapshot.py --check-only
      - name: Commit only the canonical simulated diary
        if: steps.session.outputs.due == 'true'
        env:
          SIGNAL_SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTE/genetic_invest_agent/registro_historico/diario_portfolio_forward_2026-10-12.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record original genetic simulated session'
          for attempt in 1 2 3 4; do
            python -c 'import os,sys; sys.path.insert(0,"AGENTE/genetic_invest_agent"); from forward_portfolio import ensure_before_next_open; ensure_before_next_open(os.environ["SIGNAL_SESSION"])'
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Ingest only simulated equity through GitHub OIDC
        # Retrying publication never reruns a completed session.
        if: github.event_name == 'schedule' || inputs.mode == 'publish_only' || inputs.mode == 'trade'
        run: python AGENTE/genetic_invest_agent/publish_snapshot.py

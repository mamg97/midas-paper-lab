name: MIDAS TFM paper CI

on:
  push:
    branches: [main]
    paths:
      - 'tfm_shadow/**'
      - '.github/workflows/tfm_shadow_ci.yml'
  pull_request:
    paths:
      - 'tfm_shadow/**'
      - '.github/workflows/tfm_shadow_ci.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tfm_shadow/requirements-live.txt
      - name: Install OpenMP and model libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          python -m pip install -r tfm_shadow/requirements-live.txt
      - name: Compile TFM paper engine
        run: python -m py_compile tfm_shadow/*.py
      - name: Run TFM chronology and paper tests
        run: python -m unittest discover -s tfm_shadow/tests -v

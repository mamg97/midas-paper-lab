name: MIDAS TFM paper CI

on:
  push:
    branches: [main]
    paths:
      - 'tfm_shadow/**'
      - '.github/workflows/tfm_shadow_ci.yml'
  pull_request:
    paths:
      - 'tfm_shadow/**'
      - '.github/workflows/tfm_shadow_ci.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tfm_shadow/requirements-live.txt
      - name: Install OpenMP and model libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          python -m pip install -r tfm_shadow/requirements-live.txt
      - name: Probe Yahoo Madrid daily bars
        run: |
          python - <<'PY'
          import math
          import yfinance as yf
          for ticker in ["SAN.MC", "BBVA.MC"]:
              t = yf.Ticker(ticker)
              data = t.history(period="10d", interval="1d", auto_adjust=False, actions=True, repair=False, raise_errors=True, keepna=True)
              print("TICKER", ticker)
              print(data[["Open","High","Low","Close","Volume"]].tail(3).to_string())
          bulk = yf.download(["SAN.MC","BBVA.MC"], period="10d", interval="1d", auto_adjust=False,
                             actions=False, repair=False, progress=False, threads=False, keepna=True)
          print("BULK")
          print(bulk.tail(3).to_string())
          repaired = yf.download(["SAN.MC","BBVA.MC"], period="10d", interval="1d", auto_adjust=False,
                                 actions=False, repair=True, progress=False, threads=False, keepna=True)
          print("REPAIRED")
          print(repaired.tail(3).to_string())
          for ticker in ["SAN.MC", "BBVA.MC"]:
              hourly = yf.Ticker(ticker).history(period="5d", interval="1h", auto_adjust=False,
                                                 actions=False, repair=False, prepost=False, keepna=True)
              print("HOURLY", ticker)
              print(hourly[["Open","High","Low","Close","Volume"]].tail(12).to_string())
          PY
      - name: Compile TFM paper engine
        run: python -m py_compile tfm_shadow/*.py
      - name: Run TFM chronology and paper tests
        run: python -m unittest discover -s tfm_shadow/tests -v

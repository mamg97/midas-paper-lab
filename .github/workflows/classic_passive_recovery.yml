name: MIDAS classic passive mark-only recovery

on:
  pull_request:
    paths:
      - 'classic_sp500/passive_recover_cli.py'
      - 'classic_sp500/tests/**'
      - '.github/workflows/classic_passive_recovery.yml'
  push:
    branches: [main]
    paths:
      - 'classic_sp500/passive_recover_cli.py'
      - '.github/workflows/classic_passive_recovery.yml'
  schedule:
    - cron: '21 6 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

# Same lock as the ordinary classical trading run; never race economic writers.
concurrency:
  group: midas-classic-sp500
  cancel-in-progress: false

jobs:
  passive-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: timesfm_strategy/requirements-daily.txt
      - name: Install existing daily dependencies
        run: python -m pip install -r timesfm_strategy/requirements-daily.txt
      - name: Verify market data contract and all classic positions
        run: |
          python -m unittest discover -s classic_sp500/tests -v
          python -m unittest discover -s market_data/tests -v
      - name: Dry run recovery without touching paper state
        run: python classic_sp500/passive_recover_cli.py --phase check
      - name: Recover only verified passive marks in the existing ledger
        if: ${{ github.event_name != 'pull_request' }}
        run: python classic_sp500/passive_recover_cli.py --phase recover
      - name: Publish only the canonical classical paper ledger
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record verified passive-only mark recovery" \
            --path classic_sp500_state

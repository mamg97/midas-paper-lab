name: MIDAS capital cycle paper

on:
  push:
    branches: ['main']
    paths:
      - 'capital_cycle/**'
      - '.github/workflows/capital_cycle.yml'
  pull_request:
    paths:
      - 'capital_cycle/**'
      - 'strategy_comparison/**'
      - 'research/CAPITAL_CYCLE_STRATEGY.md'
      - '.github/workflows/capital_cycle.yml'
  schedule:
    # Daily after XNYS close. The engine only ranks fundamentals at month-end;
    # other sessions settle next-open fills and mark the fictitious portfolio.
    - cron: '57 23 * * 1-5'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Verify capital-cycle code/tests without recording a session'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: midas-capital-cycle
  cancel-in-progress: false

jobs:
  capital-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: capital_cycle/requirements-live.txt
      - name: Install capital-cycle runtime
        run: python -m pip install -r capital_cycle/requirements-live.txt
      - name: Verify methodology, accounting and comparison integration
        run: |
          python -m py_compile capital_cycle/*.py strategy_comparison/report.py
          python -m unittest discover -s capital_cycle/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
      - name: Record capital-cycle paper state
        id: execute
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.preflight_only }}
        run: python capital_cycle/run.py --output capital_cycle_state
      - name: Record scheduled runtime health
        if: ${{ always() && github.event_name == 'schedule' && !inputs.preflight_only }}
        run: |
          python strategy_comparison/runtime_health.py \
            --output strategy_runtime/capital_cycle.json \
            --workflow-key capital_cycle \
            --workflow-name "MIDAS capital cycle paper" \
            --outcome "${{ steps.execute.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --head-sha "$GITHUB_SHA"
      - name: Refresh all-strategy dashboard
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.preflight_only }}
        run: |
          python strategy_comparison/report.py \
            --registry strategy_comparison/registry.json \
            --paper-config paper_demo/config.json \
            --paper-state paper_state/state.json \
            --tfm-config tfm_shadow/config.json \
            --tfm-state tfm_state/ledger.json \
            --weekly-ml-config weekly_ml/config.json \
            --weekly-ml-state weekly_ml_state/ledger.json \
            --tfg-config tfg_ahp/config.json \
            --tfg-state tfg_state/ledger.json \
            --capital-cycle-config capital_cycle/config.json \
            --capital-cycle-state capital_cycle_state/ledger.json \
            --output strategy_state
      - name: Commit capital-cycle and dashboard state
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.preflight_only }}
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS capital-cycle paper state" \\
            --path strategy_runtime/capital_cycle.json \\
            --path capital_cycle_state

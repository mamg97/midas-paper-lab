name: MIDAS weekly ML CI

on:
  pull_request:
    paths:
      - 'weekly_ml/**'
      - 'strategy_comparison/**'
      - '.github/workflows/weekly_ml.yml'
      - '.github/workflows/weekly_ml_ci.yml'
      - '.github/workflows/paper_us.yml'
      - '.github/workflows/tfm_es.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install pandas==2.3.3 numpy==2.5.3
      - name: Compile and test
        run: |
          python -m py_compile weekly_ml/*.py strategy_comparison/report.py
          python -m unittest discover -s weekly_ml/tests -v
          python -m unittest discover -s strategy_comparison/tests -v

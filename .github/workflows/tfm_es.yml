name: MIDAS TFM shadow forecasts

on:
  schedule:
    # 20:23 CET / 21:23 CEST: después del cierre de Madrid.
    - cron: '23 19 * * 1-5'
    # Segunda oportunidad la misma noche. GitHub suele retrasar los cron varias horas;
    # programarla a las 23:23 UTC evita que ese retraso la empuje tras la apertura de Madrid.
    - cron: '23 23 * * 1-5'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Verificar dependencias y pruebas sin registrar una sesión'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Todos los writers paper comparten exclusión para evitar carreras de git push
  # entre cierres/respaldos que actualizan strategy_state y strategy_runtime.
  group: midas-paper-state-writer
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tfm_shadow/requirements-live.txt
      - name: Install OpenMP and model libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          python -m pip install -r tfm_shadow/requirements-live.txt
      - name: Verify chronology and paper accounting
        run: python -m unittest discover -s tfm_shadow/tests -v
      - name: Record four forecasts and paper decisions
        id: execute
        if: ${{ !inputs.preflight_only }}
        run: python tfm_shadow/run.py --output tfm_state
      - name: Record scheduled runtime health
        if: ${{ always() && github.event_name == 'schedule' && !inputs.preflight_only }}
        run: |
          python strategy_comparison/runtime_health.py \
            --output strategy_runtime/tfm_es.json \
            --workflow-key tfm_es \
            --workflow-name "MIDAS TFM shadow forecasts" \
            --outcome "${{ steps.execute.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --head-sha "$GITHUB_SHA"
      - name: Refresh all-strategy status after Madrid close
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          python strategy_comparison/report.py \
            --registry strategy_comparison/registry.json \
            --paper-config paper_demo/config.json \
            --paper-state paper_state/state.json \
            --tfm-config tfm_shadow/config.json \
            --tfm-state tfm_state/ledger.json \
            --weekly-ml-config weekly_ml/config.json \
            --weekly-ml-state weekly_ml_state/ledger.json \
            --tfg-config tfg_ahp/config.json \
            --tfg-state tfg_state/ledger.json \
            --output strategy_state
      - name: Commit TFM shadow and comparison state
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          if [ -f strategy_runtime/tfm_es.json ]; then
            git add -- strategy_runtime/tfm_es.json
          fi
          if [ -d tfm_state ]; then
            git add -- tfm_state
          fi
          if [ -f strategy_state/dashboard.json ] && [ -f strategy_state/dashboard.md ]; then
            git add -- strategy_state/dashboard.json strategy_state/dashboard.md
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record MIDAS TFM shadow forecasts'
            git push
          fi
